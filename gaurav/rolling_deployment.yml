apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollingdeployment
  labels:
    name: rollingwqdeployment
spec:
  replicas: 3
  minReadySeconds: 2
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 2
  selector:
    matchLabels:
      type: app
  template:
    metadata:
      name: pod1   
      labels:
        env: testing    
        type: app
    spec:               
      containers:
        - name: nginx         
          image: nginx:1.14.2
 ##########################################################################################################################
 1.Kubernetes promises zero downtime and one of the reasons behind it is Rolling Deployments. 
   With Rolling Deployments, Kubernetes makes sure that the traffic to the pods are not 
   interrupted when updated pods are being deployed.
 2. we can also specify how many max unavailable pod whiling rolling if we specify maxunavailable=5 
   then it will make a batch of 5 while rolling, it will down 5 pods from old rs and create new 5 pods in new rs  
 ##########################################################################################################################
kubectl apply -f deployment.yml ; watch "kubectl get rs -o wide"
kubectl rollout status deployment <name_deployment>
