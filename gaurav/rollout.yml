create a normal deployment
---------------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 4
  selector:
    matchLabels:
      type: app
  template:
    metadata:
      labels:
        type: app
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
-------------------------------------------------------------------------------------------------------------
kubectl describe deployment nginx-deployment
the default StrategyType is RollingUpdate
change the image from 
 {image: nginx:1.14.2 > image: nginx:1.14.2:va}
kubectl apply -f abc.yml
kubectl rollout status deployment
kubectl rollout history deployment nginx-deployment   ......to check rollout history
-------------------------------------------------------------------------------------------------------------
    { deployment.apps/nginx-deployment
      REVISION  CHANGE-CAUSE
      1         <none>
      2         <none>} 
-------------------------------------------------------------------------------------------------------------
now you don't want <none> at CHANGE-CAUSE for that 
kubectl apply -f abc.yml --record
-------------------------------------------------------------------------------------------------------------
REVISION  CHANGE-CAUSE
1         kubectl apply --filename=abc.yml --record=true
-------------------------------------------------------------------------------------------------------------
suppose you want your custome msg in CHANGE-CAUSE
kubectl get deployment nginx-deployment -o yaml
-------------------------------------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
    kubectl.kubernetes.io/last-applied-configuration: |
      {"apiVersion":"apps/v1","kind":"Deployment","metadata":{"annotations":{"kubernetes.io/change-cause":"kubectl apply --filename=abc.yml --record=true"},"labels":{"type":"app"},"name":"nginx-deployment","namespace":"default"},"spec":{"replicas":4,"selector":{"matchLabels":{"type":"app"}},"template":{"metadata":{"labels":{"type":"app"}},"spec":{"containers":[{"image":"nginx:1.14.2","name":"nginx"}]}}}}
    kubernetes.io/change-cause: kubectl apply --filename=abc.yml --record=true
  creationTimestamp: "2025-06-22T05:27:36Z"
-------------------------------------------------------------------------------------------------------------
change your abc.yml file
vi abc.yml
metadata:
  name: nginx-deployment
  labels:
    type: app
  annotations:
    kubernetes.io/change-cause: "my custom msg"       ........change
 -------------------------------------------------------------------------------------------------------------   
kubectl apply -f abc.yml
kubectl rollout history deployment nginx-deployment
REVISION  CHANGE-CAUSE
1         my custom msg
2         my custom msg
suppose you have done multiple update abd suddenly you have switch the old version of application or 
you have to be rollback on older version for that 
$ kubectl rollout undo --to-revision=1 deployment <nginx-deployment>
